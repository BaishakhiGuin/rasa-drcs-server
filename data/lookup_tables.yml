version: "3.1"

# ============================================================
#  AI-DRCS  —  Lookup Tables & Regex Patterns
#  Used by RegexEntityExtractor for structured entity extraction.
# ============================================================

nlu:

# ─── MSISDN (Indian mobile numbers) ─────────────────────────────────────────
  - regex: msisdn
    examples: |
      - \b[6-9]\d{9}\b
      - \+91[6-9]\d{9}\b
      - 91[6-9]\d{9}\b

# ─── Transaction ID / UTR patterns ───────────────────────────────────────────
  - regex: transaction_id
    examples: |
      - \bUTR\d{12,18}\b
      - \bTXN[A-Z0-9]{6,20}\b
      - \bREF[A-Z0-9]{6,20}\b
      - \bPAY[A-Z0-9]{6,20}\b
      - \b[0-9]{12,18}\b
      - \b[A-Z]{2,4}[0-9]{8,16}\b

# ─── Device Serial Number ────────────────────────────────────────────────────
  - regex: device_serial
    examples: |
      - \bSBX-\d{4,8}\b
      - \bSBX\d{4,8}\b

# ─── Amount in INR ───────────────────────────────────────────────────────────
  - regex: amount
    examples: |
      - ₹\s?\d+(?:,\d{3})*(?:\.\d{2})?
      - Rs\.?\s?\d+(?:,\d{3})*(?:\.\d{2})?
      - INR\s?\d+(?:,\d{3})*(?:\.\d{2})?
      - \b\d+(?:,\d{3})*(?:\.\d{2})?\s?(?:rupees?|INR)\b

# ─── UPI ID / VPA ────────────────────────────────────────────────────────────
  - regex: upi_id
    examples: |
      - \b[a-zA-Z0-9._-]+@[a-zA-Z]{2,}\b

# ─── Complaint ID ────────────────────────────────────────────────────────────
  - regex: complaint_id
    examples: |
      - \bCMP-[A-Z0-9]{7}\b

