version: "3.1"

# ============================================================
#  AI-DRCS  —  Stories (Conversation Flows)
#  These teach Rasa the full conversation arc for each flow.
# ============================================================

stories:

# ─── GREETING FLOWS ──────────────────────────────────────────────────────────

  - story: simple greeting and help
    steps:
      - intent: greet
      - action: utter_greet
      - intent: help
      - action: utter_help

  - story: greet and device issue
    steps:
      - intent: greet
      - action: utter_greet
      - intent: device_not_working
      - action: merchant_auth_form
      - active_loop: merchant_auth_form
      - action: merchant_auth_form
      - active_loop: null
      - action: action_authenticate_merchant
      - action: utter_default

  - story: greet then goodbye
    steps:
      - intent: greet
      - action: utter_greet
      - intent: goodbye
      - action: utter_goodbye

